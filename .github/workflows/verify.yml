# The gate ledger, on every push.
#
# This is the check that matters for this project: `npm run verify` runs the registry
# fixed-point, the projection drift check, the literal acceptance check, the typecheck, the unit
# tests and all fourteen gate arms. It refuses to start if a gate is missing its matched null.
name: verify

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r requirements.txt

      # THE HEAD MODEL IS NOT IN THIS REPOSITORY. The fsaverage lead field is derived from
      # FreeSurfer and is scrubbed from history rather than redistributed (LICENSE-DATA.md), so CI
      # fetches it. The projection drift check re-derives data/projection_10_20.json from it, and
      # without this step that check has nothing to derive from.
      #
      # Cached because it is a ~1 GB download and changes only when MNE bumps the dataset.
      - name: Cache fsaverage
        uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: mne-fsaverage-${{ hashFiles('requirements.txt') }}
      - name: Fetch fsaverage if not cached
        run: python -c "import mne; mne.datasets.fetch_fsaverage(verbose=True)"

      - run: npm run verify
